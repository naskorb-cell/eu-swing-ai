name: Telegram Alerts

# Проверки в работни дни в 10:00, 13:00 и 16:30 централноевропейско време (борсите: 9:00-17:30) - 1 ч след
# отварянето, обед и 1 ч преди затварянето (тогава и скана за нови в „И двата“). GitHub пуска насрочените
# задачи със закъснение (понякога часове) или изобщо не ги пуска, затова графикът е на всеки 30 мин. (не на
# кръгъл час - тогава е най-натоварено) в работното време по UTC (покрива и лятното, и зимното време);
# alerts.py --scheduled изпълнява последната настъпила проверка, която днес още не е минала, иначе спира веднага.
on:
  schedule:
    - cron: "7,37 7-17 * * 1-5"
  workflow_dispatch:
    inputs:
      trend:
        description: "И пълния скан за нови в „🤝 И двата“ (5-10 мин.)"
        type: boolean
        default: false

concurrency:
  group: telegram-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # паметта (какво вече е пратено) - в кеша на Actions, не в repo-то (то е публично)
      - name: Restore alerts state
        uses: actions/cache/restore@v5
        with:
          path: alerts_state.json
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-

      - name: Run alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
          T212_API_KEY_WIFE: ${{ secrets.T212_API_KEY_WIFE }}
          T212_API_SECRET_WIFE: ${{ secrets.T212_API_SECRET_WIFE }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python alerts.py --scheduled
          elif [ "${{ inputs.trend }}" = "true" ]; then
            python alerts.py --trend --summary
          else
            python alerts.py --summary
          fi

      - name: Save alerts state
        if: success()
        uses: actions/cache/save@v5
        with:
          path: alerts_state.json
          key: alerts-state-${{ github.run_id }}
