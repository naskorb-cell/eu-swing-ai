name: EODHD проба

# Само ръчно: сравнява EODHD с Yahoo за няколко от ⭐ Селектирани и праща резултата в Telegram.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Брой инструменти (безплатният план: ~6 заявки на инструмент, 500 бонус)"
        default: "10"

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compare
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COUNT: ${{ inputs.count }}
        run: python eodhd_compare.py --count "$COUNT"
