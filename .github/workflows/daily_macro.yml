name: Daily Macro Scan

on:
  # Спрян автоматичен график: макро прегледът е махнат от приложението (заменен от
  # фундаментално потвърждение на сетъпите). Остава само ръчно пускане.
  workflow_dispatch: {}

jobs:
  daily-macro-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run daily macro scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python daily_macro_scan.py

      - name: Commit updated signal file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add daily_macro_signal.json
          git diff --staged --quiet || git commit -m "Daily macro scan: $(date -u +'%Y-%m-%d')"
          # main може да се е променил, докато job-ът е вървял (merge, друг workflow) -
          # издърпваме последното и опитваме пак, вместо да губим резултата
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
