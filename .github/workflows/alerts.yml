name: Telegram Alerts

# 3 пъти в работен ден (UTC; българско време = UTC+2 зимно / UTC+3 лятно):
#   08:30 - след отварянето на борсите, 12:00 - обед, 16:45 - след затварянето (+ скан за нови в „И двата“)
on:
  schedule:
    - cron: "30 8 * * 1-5"
    - cron: "0 12 * * 1-5"
    - cron: "45 16 * * 1-5"
  workflow_dispatch:
    inputs:
      trend:
        description: "И пълния скан за нови в „🤝 И двата“ (5-10 мин.)"
        type: boolean
        default: false

concurrency:
  group: telegram-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # паметта (какво вече е пратено) - в кеша на Actions, не в repo-то (то е публично)
      - name: Restore alerts state
        uses: actions/cache/restore@v4
        with:
          path: alerts_state.json
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-

      - name: Run alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
          T212_API_KEY_WIFE: ${{ secrets.T212_API_KEY_WIFE }}
          T212_API_SECRET_WIFE: ${{ secrets.T212_API_SECRET_WIFE }}
        run: |
          if [ "${{ github.event.schedule }}" = "45 16 * * 1-5" ] || [ "${{ inputs.trend }}" = "true" ]; then
            python alerts.py --trend
          else
            python alerts.py
          fi

      - name: Save alerts state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: alerts_state.json
          key: alerts-state-${{ github.run_id }}
